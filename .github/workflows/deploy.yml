name: Build and Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cloudflare-workers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci || npm install
          else
            npm install
          fi

      - name: TypeScript & Lint Check
        run: npm run lint

      - name: Run Platform & Payment Test Suite
        run: npm test

      - name: Build React Frontend Assets
        run: npm run build:pages
        env:
          NODE_ENV: production
          VITE_APP_URL: ${{ vars.VITE_APP_URL || 'https://digitalindiaproject.com' }}

      - name: Apply Remote D1 Migrations (10 Free-Plan Databases)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: bash scripts/applyD1Migrations.sh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker & Assets to Cloudflare
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env="" --keep-vars

      - name: Post-Deploy Health & Cashfree Webhook Smoke Check
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          echo "Checking /api/health..."
          curl -fsS "https://digitalindiaproject.com/api/health"
          echo ""
          echo "Checking /api/webhooks/cashfree..."
          curl -fsS "https://digitalindiaproject.com/api/webhooks/cashfree"
          echo ""

