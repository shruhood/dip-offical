# Non-production staging configuration: shares Worker code on Free Plan while preventing accidental prod mixing
[env.staging]
name = "digitalindiaproject-staging"

[env.staging.vars]
ENVIRONMENT = "staging"
APP_DOMAIN = "https://digitalindiaproject.com"
BUSINESS_EMAIL = "support@digitalindiaproject.com"
CASHFREE_API_VERSION = "2023-08-01"
CASHFREE_ENV = "sandbox"
FREE_PLAN_MAX_R2_BYTES = "1073741824"
FREE_PLAN_MAX_UPLOAD_BYTES = "10485760"
PAYMENTS_EMAIL = "payments@digitalindiaproject.com"
